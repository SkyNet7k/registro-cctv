<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supervisión y Control - Registro CCTV</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS para exportar a Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col antialiased">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-purple-600 p-2 rounded-lg text-white shadow-lg shadow-purple-600/30">
          <i class="fa-solid fa-shield-halved text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
            Panel de Supervisión CCTV
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-purple-500/10 text-purple-400 border border-purple-500/20">
              Administración
            </span>
          </h1>
          <p class="text-xs text-slate-400">Control total, edición y exportación de reportes</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-3">
        <a href="index.html" class="flex items-center gap-2 px-3 py-1.5 text-xs font-medium bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg border border-slate-600 transition">
          <i class="fa-solid fa-arrow-left text-slate-300"></i>
          Vista Operador
        </a>
        <button id="btnExportExcel" class="flex items-center gap-2 px-3 py-1.5 text-xs font-medium bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg shadow transition">
          <i class="fa-solid fa-file-excel"></i>
          Exportar Excel
        </button>
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- Filtros y Buscador Avanzado -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg flex flex-col sm:flex-row gap-4 justify-between items-center">
      <div class="relative w-full sm:w-72">
        <input type="text" id="adminSearchInput" placeholder="Buscar por tienda, novedad u operador..." class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-9 pr-3 py-2 text-xs text-slate-100 focus:outline-none focus:ring-2 focus:ring-purple-500">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-xs"></i>
      </div>
      
      <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
        <span id="adminTableCount" class="text-xs text-slate-400">Mostrando 0 registros</span>
        <button id="btnClearAll" class="flex items-center gap-1.5 px-3 py-2 text-xs font-medium bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/30 rounded-lg transition">
          <i class="fa-solid fa-trash-can"></i>
          Limpiar Todo
        </button>
      </div>
    </div>

    <!-- Tabla de Control Total -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl shadow-lg overflow-hidden flex flex-col">
      <div class="overflow-x-auto flex-1">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-900/80 text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-700">
            <tr>
              <th class="px-4 py-3">Tienda / Horario</th>
              <th class="px-4 py-3">Novedad</th>
              <th class="px-4 py-3">Solución / Observaciones</th>
              <th class="px-4 py-3">Operador</th>
              <th class="px-4 py-3 text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="adminTableBody"></tbody>
        </table>
        <div id="adminEmptyState" class="p-12 text-center text-slate-500 hidden">
          <i class="fa-regular fa-folder-open text-4xl mb-3"></i>
          <p class="text-sm">No hay registros almacenados en la base de datos.</p>
        </div>
      </div>
    </div>

  </main>

  <!-- Modal de Edición -->
  <div id="editModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3">
        <h3 class="text-base font-semibold text-white flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-purple-400"></i>
          Editar Registro de Novedad
        </h3>
        <button id="btnCloseModal" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="editForm" class="space-y-4">
        <input type="hidden" id="editId">
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Operador CCTV</label>
            <input type="text" id="editOperator" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-purple-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Tienda / Sucursal</label>
            <select id="editStore" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-purple-500"></select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Hora Inicio</label>
            <input type="time" id="editStartTime" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-purple-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Hora Fin</label>
            <input type="time" id="editEndTime" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-purple-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Tipo de Novedad</label>
          <select id="editNovelty" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-purple-500">
            <option value="Hurto / Tentativa">Hurto / Tentativa</option>
            <option value="Actitud Sospechosa">Actitud Sospechosa</option>
            <option value="Falla Técnica CCTV / Cámaras">Falla Técnica CCTV / Cámaras</option>
            <option value="Incidencia de Personal">Incidencia de Personal</option>
            <option value="Apertura / Cierre de Tienda">Apertura / Cierre de Tienda</option>
            <option value="Falla Eléctrica / Red">Falla Eléctrica / Red</option>
            <option value="Otro">Otro / General</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Solución / Observaciones</label>
          <textarea id="editSolution" rows="3" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-purple-500 resize-none"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" id="btnCancelEdit" class="px-4 py-2 text-xs font-medium bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg transition">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-xs font-medium bg-purple-600 hover:bg-purple-500 text-white rounded-lg transition shadow-lg shadow-purple-600/30">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Script Admin -->
  <script src="admin.js"></script>
</body>
</html>
