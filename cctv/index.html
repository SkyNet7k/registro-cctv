<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro CCTV</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col antialiased">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 p-2 rounded-lg text-white shadow-lg shadow-indigo-600/30">
          <i class="fa-solid fa-video text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
            Registro CCTV
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>
              En línea
            </span>
          </h1>
          <p class="text-xs text-slate-400">Control y seguimiento operativo de novedades</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-3">
        <button id="btnQuickReport" class="flex items-center gap-2 px-3 py-1.5 text-xs font-medium bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg border border-slate-600 transition">
          <i class="fa-brands fa-whatsapp text-emerald-400"></i>
          Resumen WhatsApp
        </button>
        <button id="btnExportCsv" class="flex items-center gap-2 px-3 py-1.5 text-xs font-medium bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition">
          <i class="fa-solid fa-file-excel"></i>
          Exportar Excel
        </button>
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

      <!-- Formulario -->
      <div class="lg:col-span-4 bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
        <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-4">
          <h2 class="text-base font-semibold text-white flex items-center gap-2">
            <i class="fa-solid fa-pen-to-square text-indigo-400"></i>
            <span id="formTitle">Registro de Novedad</span>
          </h2>
          <button id="btnCancelEdit" class="hidden text-xs text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-xmark mr-1"></i> Cancelar
          </button>
        </div>

        <form id="caseForm" class="space-y-4">
          <!-- Operador -->
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Operador CCTV</label>
            <input type="text" id="operatorName" required placeholder="Nombre o código del operador" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>

          <!-- Tienda -->
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Tienda / Sucursal</label>
            <select id="storeSelect" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="" disabled selected>Seleccione una tienda...</option>
              <option value="Sambil Maracaibo">Sambil Maracaibo</option>
              <option value="Mall Del Delicias">Mall Del Delicias</option>
              <option value="Lago Mall">Lago Mall</option>
              <option value="Costa Verde">Costa Verde</option>
              <option value="Sucursal Zulia Centro">Sucursal Zulia Centro</option>
            </select>
          </div>

          <!-- Horas -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Hora Inicio</label>
              <input type="time" id="startTime" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="block text-xs font-medium text-slate-300">Hora Fin</label>
                <button type="button" id="btnSetNow" class="text-[10px] bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-slate-300">Ahora</button>
              </div>
              <input type="time" id="endTime" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
          </div>

          <!-- Tipo de Novedad -->
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Tipo de Novedad</label>
            <select id="noveltyType" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="" disabled selected>Seleccione tipo...</option>
              <option value="Hurto / Tentativa">Hurto / Tentativa</option>
              <option value="Actitud Sospechosa">Actitud Sospechosa</option>
              <option value="Falla Técnica CCTV / Cámaras">Falla Técnica CCTV / Cámaras</option>
              <option value="Incidencia de Personal">Incidencia de Personal</option>
              <option value="Apertura / Cierre de Tienda">Apertura / Cierre de Tienda</option>
              <option value="Falla Eléctrica / Red">Falla Eléctrica / Red</option>
              <option value="Otro">Otro / General</option>
            </select>
          </div>

          <!-- Solución -->
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Solución / Observaciones</label>
            <textarea id="solutionText" rows="3" required placeholder="Escriba las acciones tomadas o resolución del caso..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
          </div>

          <!-- Botón -->
          <button type="submit" id="btnSubmitForm" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-lg transition shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2 text-sm">
            <i class="fa-solid fa-floppy-disk"></i>
            Guardar Caso
          </button>
        </form>
      </div>

      <!-- Tabla de Registros -->
      <div class="lg:col-span-8 bg-slate-800 border border-slate-700 rounded-xl shadow-lg overflow-hidden flex flex-col">
        
        <div class="p-4 border-b border-slate-700 bg-slate-800/50 flex flex-col sm:flex-row gap-3 justify-
