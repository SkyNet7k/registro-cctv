<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro CCTV - Operador</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col antialiased">

  <!-- Header Limpio sin el botón del Admin -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 p-2 rounded-lg text-white shadow-lg shadow-indigo-600/30">
          <i class="fa-solid fa-video text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
            Registro CCTV
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>
              En línea
            </span>
          </h1>
          <p class="text-xs text-slate-400">Dpto. de Seguridad Electrónica</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

      <!-- Formulario Adaptado al Nuevo Formato -->
      <div class="lg:col-span-5 bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
        <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-4">
          <h2 class="text-base font-semibold text-white flex items-center gap-2">
            <i class="fa-solid fa-pen-to-square text-indigo-400"></i>
            <span id="formTitle">Cargar Reporte de Novedad</span>
          </h2>
          <span class="text-[10px] bg-slate-700 px-2 py-0.5 rounded text-slate-300">Seguridad Electrónica</span>
        </div>

        <form id="caseForm" class="space-y-3">
          <!-- Operador y Sede -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Operador / Actuante</label>
              <input type="text" id="operatorName" required placeholder="Tu nombre o código" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Sede / Sucursal</label>
              <select id="storeSelect" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="" disabled selected>Seleccione sede...</option>
              </select>
            </div>
          </div>

          <!-- Horas -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Hora Inicio</label>
              <input type="time" id="startTime" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="block text-xs font-medium text-slate-300">Hora Fin</label>
                <button type="button" id="btnSetNow" class="text-[10px] bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-slate-300">Ahora</button>
              </div>
              <input type="time" id="endTime" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
          </div>

          <!-- Tipo de Novedad / Categoría -->
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Tipo de Incidencia / Categoría</label>
            <select id="noveltyType" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="" disabled selected>Seleccione tipo...</option>
              <option value="Accidente Laboral">Accidente Laboral</option>
              <option value="Hurto / Tentativa">Hurto / Tentativa</option>
              <option value="Actitud Sospechosa">Actitud Sospechosa</option>
              <option value="Falla Técnica CCTV / Cámaras">Falla Técnica CCTV / Cámaras</option>
              <option value="Incidencia de Personal">Incidencia de Personal</option>
              <option value="Apertura / Cierre de Tienda">Apertura / Cierre de Tienda</option>
              <option value="Falla Eléctrica / Red">Falla Eléctrica / Red</option>
              <option value="Otro / General">Otro / General</option>
            </select>
          </div>

          <!-- Descripción de la Novedad -->
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Novedad (Detalle del incidente)</label>
            <textarea id="noveltyDetails" rows="3" required placeholder="Ej. El Supervisor Reinoso informa sobre incidente en charcutería..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
          </div>

          <!-- Nuevo Campo: Soluciones -->
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Soluciones</label>
            <textarea id="solutionText" rows="2" required placeholder="Ej. Se comparte video con el jefe de zona y se entregan productos..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
          </div>

          <!-- Acciones Tomadas -->
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Acciones Tomadas</label>
            <textarea id="actionText" rows="2" required placeholder="Ej. Se le hace un llamado de atención..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
          </div>

          <!-- Actuantes / Involucrados -->
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Actuantes / Involucrados (Supervisores, Jefes)</label>
            <input type="text" id="actorsText" required placeholder="Ej. Sup. Vera, Torrealba, Moscote" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>

          <!-- Botón Guardar -->
          <button type="submit" id="btnSubmitForm" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-lg transition shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2 text-sm mt-2">
            <i class="fa-solid fa-floppy-disk"></i>
            Guardar Reporte
          </button>
        </form>
      </div>

      <!-- Tabla de Registros del Operador con Botón de WhatsApp y Nombre de Operador Integrados -->
      <div class="lg:col-span-7 bg-slate-800 border border-slate-700 rounded-xl shadow-lg overflow-hidden flex flex-col">
        <!-- Cabecera de la Tabla -->
        <div class="p-4 border-b border-slate-700 bg-slate-800/50 flex flex-col sm:flex-row gap-3 justify-between items-center">
          
          <div class="flex items-center gap-3 w-full sm:w-auto">
            <div class="relative w-full sm:w-52">
              <input type="text" id="searchInput" placeholder="Buscar registros..." class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-9 pr-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-xs"></i>
            </div>
            
            <!-- Nombre del Operador Activo -->
            <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 bg-slate-900/80 border border-slate-700 rounded-lg text-xs text-indigo-400 font-medium">
              <i class="fa-solid fa-user-shield text-indigo-400"></i>
              <span id="displayOperator">Operador: No asignado</span>
            </div>
          </div>

          <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
            <span id="tableCountInfo" class="text-xs text-slate-400">Mostrando 0 registros</span>
            
            <!-- Botón de Resumen WhatsApp Ubicado Dentro del Recuadro -->
            <button id="btnQuickReport" class="flex items-center gap-2 px-3 py-1.5 text-xs font-medium bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg shadow-md transition">
              <i class="fa-brands fa-whatsapp"></i>
              Enviar WhatsApp
            </button>
          </div>
        </div>

        <div class="overflow-x-auto flex-1">
          <table class="w-full text-left text-xs text-slate-300">
            <thead class="bg-slate-900/60 text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-700">
              <tr>
                <th class="px-4 py-3">Sede / Horario</th>
                <th class="px-4 py-3">Novedad, Soluciones y Acciones</th>
                <th class="px-4 py-3">Actuantes</th>
              </tr>
            </thead>
            <tbody id="casesTableBody"></tbody>
          </table>
          <div id="emptyState" class="p-8 text-center text-slate-500 hidden">
            <i class="fa-regular fa-folder-open text-3xl mb-2"></i>
            <p class="text-xs">No hay novedades registradas en este turno.</p>
          </div>
        </div>
      </div>

    </div>

  </main>

  <!-- Script JavaScript -->
  <script src="script.js"></script>
</body>
</html>
